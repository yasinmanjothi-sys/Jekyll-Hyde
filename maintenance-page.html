<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Updating... | Jekyll & Hyde</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #000;
      --burgundy: #800020;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: #fff;
      font-family: 'Geist', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    
    .container {
      max-width: 600px;
      padding: 2rem;
      position: relative;
      z-index: 10;
    }

    .logo-img {
      max-width: 250px;
      height: auto;
      margin-bottom: 2rem;
      filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
    }

    h1 {
      font-family: 'Pirata One', cursive;
      font-size: 3.5rem;
      margin: 0 0 1rem 0;
      letter-spacing: 0.05em;
      font-weight: normal;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #a0a0a0;
      margin-bottom: 3rem;
    }

    .loader {
      width: 48px;
      height: 48px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: inline-block;
      position: relative;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
    }
    .loader::after {
      content: '';  
      box-sizing: border-box;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: var(--burgundy);
    }
    
    @keyframes rotation {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.8) 120%);
      pointer-events: none;
      z-index: 5;
    }
    
    .blueprint-grid {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: 1;
      opacity: 0.4;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="blueprint-grid"></div>
  <div class="vignette"></div>
  
  <div class="container">
    <!-- Using the live URL so the logo loads even when you delete the server files -->
    <img src="https://jekyllandhydekenya.com/LOGO-FINAL.svg" alt="Jekyll & Hyde Logo" class="logo-img" onerror="this.style.display='none'">
    
    <h1>Brewing Updates</h1>
    <p>The laboratory is currently undergoing a system update. <br>Please check back in a few moments as we prepare something exquisite.</p>
    
    <div class="loader"></div>
  </div>
</body>
</html>
